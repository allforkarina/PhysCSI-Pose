metadata:
  skeleton_name: human36m17
  input_layout: antenna,subcarrier,time

data:
  root: /data/WiFiPose/dataset/clean_dataset
  x_file: X_amp_resampled.npy
  y_file: Y_2d_clean.npy
  meta_file: meta.npz
  split_index_file: split_index.npz
  eval_env: 4
  normalization: train_split_only
  normalization_chunk_size: 1024
  precompute_wavelet: false

model:
  type: baseline
  num_joints: 17
  d_model: 256
  wavelet_bands:
    - raw
  fine_branch: false
  gate: false
  graph_refinement: false

losses:
  coordinate_l1: 1.0
  bone_length: 0.1
  base_coordinate_l1: 0.0

trainable_groups:
  - all

training:
  epochs: 80
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 4
  device: auto
  checkpoint_dir: outputs/checkpoints/baseline

evaluation:
  pck_thresholds:
    - 0.05
    - 0.1
    - 0.2

reproducibility:
  seed: 20260623

logging:
  metrics:
    - overall_mpjpe
    - per_joint_mpjpe
    - joint_group_mpjpe
    - wrist_mpjpe
    - ankle_mpjpe
  diagnostics: []
