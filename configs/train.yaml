experiment:
  protocol: source_only
  env_id: 1
  run_name: null
  output_dir: runs
  seed: 42
  device: auto

data:
  memmap_root: /data/WiFiPose/dataset/memmap
  feature_selection:
    names: [L_norm, D_center, F_sub, C_ant]
  window:
    length: 4
    stride: 1
    rebuild_index: false
  splits:
    train: train
    val: val

model:
  input_channels: auto
  token_dim: 128
  num_joints: 17
  encoder:
    out_channels: 128
  token_projection:
    num_attention_maps: 4
    dropout: 0.1
  temporal:
    min_window_length: 4
    max_window_length: 8
    num_layers: 2
    num_heads: 4
    ffn_expansion: 2
    attention_dropout: 0.1
    ffn_dropout: 0.1
    residual_dropout: 0.1
  decoder:
    heatmap_size: 64
    coord_min: -0.8
    coord_max: 0.8
    joint_hidden_dim: 128
    decoder_channels: 64
    seed_size: 8
    dropout: 0.1

train:
  epochs: 100
  batch_size: 32
  num_workers: 4
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  amp: true

scheduler:
  name: cosine
  min_lr: 1.0e-5
  warmup_epochs: 10

checkpoint:
  monitor: val_loss
  mode: min
  save_best: true
  save_last: true

early_stopping:
  enabled: true
  monitor: val_loss
  mode: min
  patience: 20
  min_delta: 0.0

metrics:
  pck_thresholds: [0.05, 0.10, 0.20, 0.50]
